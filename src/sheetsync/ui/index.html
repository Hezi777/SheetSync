<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SheetSync — Watching files</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root{
      --glass-bg: rgba(255,255,255,0.06);
      --glass-bg-hover: rgba(255,255,255,0.09);
      --glass-bg-active: rgba(255,255,255,0.12);
      --glass-border: rgba(255,255,255,0.10);
      --glass-border-dim: rgba(255,255,255,0.05);
      --text: rgba(255,255,255,0.95);
      --text-2: rgba(255,255,255,0.55);
      --text-3: rgba(255,255,255,0.30);
      --accent-green: #39FF14;
      --accent-blue: #4B8EFF;
      --accent-green-dim: rgba(57,255,20,0.15);
      --accent-blue-dim: rgba(75,142,255,0.15);
      --success: #39FF14;
      --error: #FF6464;
      --warning: #FFB547;
      --syncing: #4B8EFF;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Geist", system-ui, sans-serif;
      --mono: "SF Mono", "Geist Mono", ui-monospace, Menlo, monospace;
    }
    *{ box-sizing: border-box; }
    html, body{
      margin:0; padding:0; height:100%;
      background:#000;
      color:var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow:hidden;
    }
    body::before{
      content:""; position:fixed; inset:0;
      background-image:url("assets/wallpaper.png");
      background-size:cover; background-position:center;
      z-index:-2;
    }
    body::after{
      content:""; position:fixed; inset:0;
      background: radial-gradient(ellipse 90% 70% at 70% 30%, rgba(0,0,0,0.0) 0%, rgba(0,0,0,0.35) 70%, rgba(0,0,0,0.6) 100%);
      z-index:-1; pointer-events:none;
    }

    .stage{
      width:100%; height:100vh;
      display:flex; align-items:center; justify-content:center;
      padding:28px;
    }

    /* macOS window */
    .mac-window{
      width: min(1280px, 100%);
      height: min(820px, calc(100vh - 56px));
      border-radius:14px;
      overflow:hidden;
      background: rgba(10,10,10,0.55);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.08);
      display:flex; flex-direction:column;
      position:relative;
      box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.4);
    }

    .titlebar{
      height: 38px; flex-shrink:0;
      display:flex; align-items:center; padding: 0 14px;
      position:relative;
      border-bottom: 1px solid var(--glass-border-dim);
    }
    .traffic{ display:flex; gap:8px; align-items:center; }
    .tl{ width:12px; height:12px; border-radius:50%; }
    .tl.close{ background:#ff5f57; }
    .tl.min{ background:#febc2e; }
    .tl.max{ background:#28c840; }
    .title{
      position:absolute; left:50%; top:50%;
      transform: translate(-50%,-50%);
      font-size:13px; font-weight:500; color:var(--text-2);
      letter-spacing: -0.01em;
      display:flex; gap:6px; align-items:center;
    }
    .title-dot{
      width:6px; height:6px; border-radius:50%;
      background: var(--success);
      box-shadow: 0 0 8px rgba(57,255,20,0.7);
    }

    .body{ flex:1; display:flex; min-height:0; }

    /* Sidebar */
    .sidebar{
      width:220px; flex-shrink:0;
      border-right: 1px solid var(--glass-border-dim);
      padding: 12px 10px 10px;
      display:flex; flex-direction:column;
      gap:14px;
      background: rgba(255,255,255,0.02);
    }
    .brand{
      display:flex; align-items:center; gap:9px;
      padding: 4px 8px 8px;
    }
    .brand-mark{
      width:22px; height:22px; border-radius:6px;
      background:
        linear-gradient(135deg, rgba(57,255,20,0.9), rgba(75,142,255,0.9));
      position:relative;
      display:flex; align-items:center; justify-content:center;
      border: 1px solid rgba(255,255,255,0.25);
    }
    .brand-mark::before{
      content:""; position:absolute; inset:3px;
      border-radius:3px;
      background:
        linear-gradient(0deg, rgba(0,0,0,0.4) 0%, transparent 60%),
        repeating-linear-gradient(90deg, transparent 0 4px, rgba(255,255,255,0.18) 4px 5px),
        repeating-linear-gradient(0deg, transparent 0 4px, rgba(255,255,255,0.18) 4px 5px);
    }
    .brand-name{
      font-size:14px; font-weight:600; letter-spacing:-0.02em; color:var(--text);
    }

    .nav-section{
      display:flex; flex-direction:column; gap:1px;
      padding: 0 2px;
    }
    .nav-label{
      font-size: 10px; font-weight:600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-3);
      padding: 6px 8px 6px;
    }
    .nav-item{
      height:30px;
      display:flex; align-items:center; gap:9px;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 13px; font-weight: 500;
      color: var(--text-2);
      cursor: default;
      transition: background 150ms ease, color 150ms ease;
      position: relative;
    }
    .nav-item:hover{ background: var(--glass-bg-hover); color: var(--text); }
    .nav-item.active{ background: var(--glass-bg-active); color: var(--text); }
    .nav-item .ic{ width:14px; height:14px; flex-shrink:0; color: currentColor; opacity:.85; }
    .nav-item .count{
      margin-left:auto;
      font-size: 10px; font-weight: 500;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }
    .nav-item.active .count{ color: var(--text-2); }
    .nav-item .dot{
      margin-left:auto;
      width:5px; height:5px; border-radius:50%;
      background: var(--accent-green);
      box-shadow: 0 0 6px rgba(57,255,20,0.6);
    }

    .sidebar-foot{
      margin-top:auto;
      padding: 8px;
      border-top: 1px solid var(--glass-border-dim);
      display:flex; align-items:center; gap:10px;
    }
    .avatar{
      width:26px; height:26px; border-radius:50%;
      background: linear-gradient(135deg, #4B8EFF, #9D4BFF);
      display:flex; align-items:center; justify-content:center;
      font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.95);
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .avatar-meta{ min-width:0; flex:1; }
    .avatar-name{ font-size: 12px; font-weight: 500; color: var(--text); }
    .avatar-email{
      font-size: 11px; color: var(--text-3);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .icon-btn{
      width:26px; height:26px;
      border-radius: 8px;
      display:flex; align-items:center; justify-content:center;
      color: var(--text-3);
      cursor: default;
      transition: background 150ms ease, color 150ms ease;
    }
    .icon-btn:hover{ background: var(--glass-bg-hover); color: var(--text); }

    /* Main content */
    .main{
      flex:1; min-width:0;
      display:flex; flex-direction:column;
      overflow:hidden;
    }
    .toolbar{
      height: 50px; flex-shrink:0;
      display:flex; align-items:center; gap:12px;
      padding: 0 20px;
      border-bottom: 1px solid var(--glass-border-dim);
    }
    .crumbs{
      display:flex; align-items:center; gap:6px;
      font-size: 13px; color: var(--text-2);
    }
    .crumbs .sep{ color: var(--text-3); }
    .crumbs .here{ color: var(--text); font-weight: 500; }
    .toolbar-spacer{ flex:1; }
    .search{
      width: 220px; height: 28px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 0 10px;
      display:flex; align-items:center; gap:8px;
      color: var(--text-3);
      font-size: 12px;
    }
    .search input{
      flex:1; background: transparent; border: 0; outline: none;
      color: var(--text); font: inherit; font-size: 12px;
    }
    .search input::placeholder{ color: var(--text-3); }
    .search .kbd{
      font-family: var(--mono); font-size: 10px; color: var(--text-3);
      padding: 1px 5px; border-radius: 4px;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.03);
    }

    .scroll{ flex:1; overflow-y:auto; padding: 20px 24px 24px; }
    .scroll::-webkit-scrollbar{ width:8px; }
    .scroll::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,0.08); border-radius: 4px;
    }

    /* Glass panel base */
    .glass{
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
    }
    .glass-hover:hover{ background: var(--glass-bg-hover); }

    /* Buttons */
    .btn{
      height: 32px; padding: 0 13px;
      border-radius: 10px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-2);
      font: inherit; font-size: 13px; font-weight: 500;
      cursor: default;
      display: inline-flex; align-items: center; gap: 7px;
      transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
      backdrop-filter: blur(10px);
    }
    .btn:hover{ background: var(--glass-bg-hover); color: var(--text); }
    .btn.primary{
      background: rgba(57,255,20,0.13);
      border-color: rgba(57,255,20,0.40);
      color: #39FF14;
      height: 36px;
      border-radius: 12px;
    }
    .btn.primary:hover{ background: rgba(57,255,20,0.20); }
    .btn.blue{
      background: rgba(75,142,255,0.13);
      border-color: rgba(75,142,255,0.40);
      color: #9DC0FF;
    }
    .btn.blue:hover{ background: rgba(75,142,255,0.20); }
    .btn .kbd{
      font-family: var(--mono); font-size: 10px;
      color: var(--text-3);
      padding: 1px 5px; border-radius: 4px;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.03);
      margin-left: 4px;
    }
    .btn.primary .kbd{
      color: rgba(57,255,20,0.7);
      border-color: rgba(57,255,20,0.25);
      background: rgba(57,255,20,0.06);
    }

    /* Hero */
    .hero{
      position: relative; overflow:hidden;
      padding: 24px 28px;
      margin-bottom: 18px;
    }
    .hero .glow{
      position: absolute; inset: 0;
      pointer-events: none;
      transition: opacity 200ms ease;
    }
    .hero .glow.green{
      background: radial-gradient(ellipse 60% 80% at 88% 10%, rgba(57,255,20,0.16), transparent 55%);
    }
    .hero .glow.blue{
      background: radial-gradient(ellipse 60% 80% at 88% 10%, rgba(75,142,255,0.18), transparent 55%);
    }
    .hero .glow.red{
      background: radial-gradient(ellipse 60% 80% at 88% 10%, rgba(255,100,100,0.13), transparent 55%);
    }
    .hero-inner{ position: relative; }
    .status-badge{
      display:inline-flex; align-items:center; gap:8px;
      padding: 5px 11px 5px 9px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      font-size: 12px; font-weight: 500;
      color: var(--text-2);
      backdrop-filter: blur(10px);
    }
    .status-dot{
      width:6px; height:6px; border-radius:50%;
      background: var(--accent-green);
      animation: pulse 2s ease-in-out infinite;
    }
    .status-dot.blue{ background: var(--accent-blue); }
    .status-dot.red{ background: var(--error); animation: none; }
    @keyframes pulse{
      0%, 100%{ transform: scale(1); opacity: 1; }
      50%{ transform: scale(1.5); opacity: 0.7; }
    }
    .hero h1{
      margin: 14px 0 6px;
      font-size: 28px; font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
      max-width: 560px;
      line-height: 1.15;
    }
    .hero h1 .accent{ color: var(--accent-green); }
    .hero h1 .accent.blue{ color: var(--accent-blue); }
    .hero p{
      margin: 0 0 18px;
      font-size: 13px;
      color: var(--text-2);
      max-width: 520px;
      line-height: 1.5;
    }
    .hero-actions{ display:flex; gap:8px; align-items:center; }

    .hero-stats{
      display:flex; gap: 28px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--glass-border-dim);
    }
    .stat .num{
      font-size: 18px; font-weight: 600; letter-spacing: -0.02em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .stat .num.green{ color: var(--accent-green); }
    .stat .num.blue{ color: var(--accent-blue); }
    .stat .lbl{
      margin-top: 2px;
      font-size: 11px; font-weight: 500; letter-spacing: 0.01em;
      color: var(--text-3); text-transform: uppercase;
    }

    /* Section heading */
    .section-h{
      display:flex; align-items:baseline; gap: 10px;
      margin: 22px 4px 12px;
    }
    .section-h h2{
      margin: 0; font-size: 14px; font-weight: 600;
      letter-spacing: -0.01em; color: var(--text);
    }
    .section-h .count{
      font-size: 11px; font-weight: 500;
      color: var(--text-3);
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid var(--glass-border-dim);
    }
    .section-h .spacer{ flex:1; }
    .section-h .link{
      font-size: 12px; color: var(--text-2); cursor: default;
    }
    .section-h .link:hover{ color: var(--text); }

    /* Connections grid */
    .grid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .conn{
      padding: 14px 16px;
      cursor: default;
      transition: background 150ms ease;
      display:flex; flex-direction: column; gap: 12px;
    }
    .conn:hover{ background: var(--glass-bg-hover); }
    .conn-top{ display:flex; align-items:center; gap:10px; }
    .conn-icons{
      display:flex; align-items:center; gap: 4px;
    }
    .source-ic, .dest-ic{
      width:24px; height:24px;
      border-radius:7px;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
    }
    .arrow{
      color: var(--text-3); font-size: 11px;
      width:14px; text-align:center;
    }
    .conn-title{
      flex:1; min-width:0;
      display:flex; flex-direction:column; gap:1px;
    }
    .conn-title .name{
      font-size: 13px; font-weight: 600; color: var(--text);
      letter-spacing: -0.005em;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .conn-title .path{
      font-family: var(--mono); font-size: 11px; color: var(--text-3);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .conn-state{
      display:flex; align-items:center; gap:6px;
      font-size: 11px; color: var(--text-2);
      padding: 3px 8px 3px 7px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border-dim);
      flex-shrink:0;
    }
    .conn-state .d{
      width: 5px; height: 5px; border-radius:50%;
      background: var(--accent-green);
    }
    .conn-state.blue .d{ background: var(--accent-blue); animation: pulse 1.8s ease-in-out infinite; }
    .conn-state.red .d{ background: var(--error); }
    .conn-state.idle .d{ background: var(--text-3); }

    .conn-meta{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }
    .meta-cell .v{
      font-size: 13px; font-weight: 600; color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }
    .meta-cell .v.dim{ color: var(--text-2); font-weight: 500; }
    .meta-cell .l{
      font-size: 10px; font-weight: 500; letter-spacing: 0.02em;
      text-transform: uppercase; color: var(--text-3);
      margin-top: 2px;
    }

    /* Activity */
    .activity{
      padding: 4px 0;
    }
    .act-row{
      height: 34px;
      display:flex; align-items:center; gap: 12px;
      padding: 0 16px;
      cursor: default;
      transition: background 150ms ease;
    }
    .act-row:hover{ background: rgba(255,255,255,0.04); }
    .act-dot{
      width: 5px; height: 5px; border-radius:50%;
      background: var(--success);
      flex-shrink:0;
    }
    .act-dot.blue{ background: var(--accent-blue); }
    .act-dot.red{ background: var(--error); }
    .act-dot.yellow{ background: var(--warning); }
    .act-dot.idle{ background: var(--text-3); }
    .act-time{
      font-family: var(--mono); font-size: 11px;
      color: var(--text-3);
      width: 78px; flex-shrink: 0;
    }
    .act-msg{
      flex:1; min-width:0;
      font-size: 13px; color: var(--text-2);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .act-msg b{ color: var(--text); font-weight: 500; }
    .act-msg .mono{
      font-family: var(--mono); font-size: 12px; color: var(--text-2);
    }
    .act-rows{
      font-family: var(--mono); font-size: 11px; color: var(--text-3);
      padding: 2px 8px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border-dim);
      border-radius: 999px;
      flex-shrink: 0;
    }

    /* Toasts */
    .toasts{
      position: fixed; right: 24px; bottom: 24px;
      display:flex; flex-direction:column-reverse;
      gap: 8px; z-index: 99;
      pointer-events: none;
    }
    .toast{
      width: 300px;
      background: var(--glass-bg-hover);
      backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid var(--glass-border);
      border-left: 2px solid var(--accent-green);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      animation: toast-in 180ms ease-out;
      pointer-events: auto;
      display:flex; gap:10px; align-items:flex-start;
    }
    .toast.blue{ border-left-color: var(--accent-blue); }
    .toast.red{ border-left-color: var(--error); }
    @keyframes toast-in{
      from{ transform: translateY(6px); opacity: 0; }
      to{ transform: translateY(0); opacity: 1; }
    }
    .toast-title{
      font-size: 13px; font-weight: 600; color: var(--text);
      letter-spacing: -0.005em;
    }
    .toast-msg{
      font-size: 12px; color: var(--text-2);
      margin-top: 2px;
    }
    .toast-ic{
      width: 16px; height: 16px; flex-shrink:0;
      color: var(--accent-green);
      margin-top: 1px;
    }
    .toast.blue .toast-ic{ color: var(--accent-blue); }
    .toast.red .toast-ic{ color: var(--error); }

    /* Inline progress on syncing connection */
    .progress{
      height: 3px; background: rgba(255,255,255,0.06);
      border-radius: 999px; overflow: hidden;
      margin-top: 2px;
    }
    .progress > i{
      display:block; height: 100%;
      background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
      width: 40%;
      animation: progress 1.4s ease-in-out infinite;
    }
    @keyframes progress{
      0%{ transform: translateX(-100%); }
      100%{ transform: translateX(350%); }
    }

    /* small */
    .row{ display:flex; align-items:center; gap:8px; }
    .col{ display:flex; flex-direction:column; }
    .muted{ color: var(--text-3); }
    .mono{ font-family: var(--mono); }

    /* ── Pair tiles (Excel ↔ Sheets) ──────────────────────────────────────────────────── */
    .pair-icons{ display:flex; align-items:center; gap:8px; }
    .dir-arrow{ display:block; }
    .dir-arrow.syncing path{
      stroke-dasharray: 6 4;
      animation: dirmove 1.2s linear infinite;
    }
    @keyframes dirmove{ to { stroke-dashoffset: -10; } }
    .conn-title .path-side{ color: var(--text-2); }
    .conn-title .path-sep{ color: var(--text-3); margin: 0 6px; }
    .conn-title .path-cloud{ color: var(--text-3); }

    /* ── Generic screen header ─────────────────────────────────────────────────────────── */
    .screen-h{
      display:flex; align-items:flex-end; gap:18px;
      padding: 4px 4px 18px;
    }
    .screen-title{
      margin:0; font-size:24px; font-weight:700; letter-spacing:-0.025em;
      color:var(--text);
    }
    .screen-sub{
      margin-top:4px; font-size:13px; color:var(--text-2); max-width:560px;
    }
    .screen-actions{ margin-left:auto; display:flex; gap:8px; }

    /* ── Sync pairs screen ────────────────────────────────────────────────────────────── */
    .filter-bar{
      display:flex; align-items:center; gap:6px;
      padding:8px 10px; margin-bottom:14px;
    }
    .filter-chip{
      height:26px; padding:0 12px;
      display:inline-flex; align-items:center; gap:8px;
      border-radius:8px; font-size:12px; font-weight:500; color:var(--text-2);
      cursor:default; transition: background 150ms ease, color 150ms ease;
    }
    .filter-chip:hover{ background: var(--glass-bg-hover); color:var(--text); }
    .filter-chip.active{ background: var(--glass-bg-active); color:var(--text); }
    .chip-count{
      font-size:10px; color:var(--text-3);
      padding:1px 6px; border-radius:999px;
      background:rgba(255,255,255,0.04); border:1px solid var(--glass-border-dim);
    }

    .filter-end{
      font-size:12px; color:var(--text-3);

      padding:0 8px;
    }

    .pairs-split{
      display:grid; grid-template-columns: 1.4fr 1fr; gap:14px;
    }
    .pairs-list{ padding: 4px 0; overflow:hidden; }
    .pairs-head{
      display:grid;
      grid-template-columns: 2.2fr 1.4fr 0.7fr 0.9fr 0.9fr;
      gap:12px; padding:8px 16px;
      font-size:10px; font-weight:600; letter-spacing:0.08em;
      text-transform:uppercase; color:var(--text-3);
      border-bottom:1px solid var(--glass-border-dim);
    }
    .pairs-row{
      display:grid;
      grid-template-columns: 2.2fr 1.4fr 0.7fr 0.9fr 0.9fr;
      gap:12px; align-items:center;
      padding:10px 16px; cursor:default;
      transition: background 150ms ease;
      border-bottom:1px solid var(--glass-border-dim);
    }
    .pairs-row:last-child{ border-bottom:0; }
    .pairs-row:hover{ background: rgba(255,255,255,0.04); }
    .pairs-row.selected{ background: var(--glass-bg-active); }
    .pr-name{ display:flex; align-items:center; gap:10px; min-width:0; }
    .pr-tiles{ display:flex; gap:-4px; }
    .pr-tiles > *:nth-child(2){ margin-left:-6px; }
    .pr-text{ min-width:0; }
    .pr-title{
      font-size:13px; font-weight:600; color:var(--text);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      letter-spacing:-0.005em;
    }
    .pr-sub{
      font-size:11px; color:var(--text-3);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .pr-dir{
      display:flex; align-items:center; gap:8px;
      font-size:12px; color:var(--text-2);
    }
    .pr-rows, .pr-time{ font-size:12px; color:var(--text-2); }
    .pr-state{ justify-self:start; }

    .pairs-detail{ padding: 18px 20px; display:flex; flex-direction:column; gap:14px; }
    .pd-head{ display:flex; align-items:center; gap:14px; }
    .pd-tiles{ display:flex; align-items:center; gap:8px; }
    .pd-title-block{ flex:1; min-width:0; }
    .pd-title{
      margin:0 0 6px; font-size:18px; font-weight:600;
      letter-spacing:-0.02em; color:var(--text);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .pd-row{
      display:flex; gap:14px; align-items:baseline;
      padding:9px 0; border-top:1px solid var(--glass-border-dim);
    }
    .pd-lbl{
      flex:0 0 110px; font-size:11px; font-weight:500;
      letter-spacing:0.04em; text-transform:uppercase; color:var(--text-3);
    }
    .pd-val{
      flex:1; min-width:0; font-size:13px; color:var(--text);
      word-break:break-all;
    }
    .pd-val.mono{ font-size:12px; color:var(--text-2); }
    .pd-id{
      margin-left:8px; font-family:var(--mono); font-size:10px;
      color:var(--text-3); padding:1px 6px; border-radius:4px;
      background:rgba(255,255,255,0.03); border:1px solid var(--glass-border-dim);
    }
    .pd-side{ color:var(--text-3); margin-left:8px; font-size:12px; }
    .pd-grid{
      display:grid; grid-template-columns:repeat(3,1fr);
      gap:8px; padding:10px 14px; margin-top:4px;
      background: rgba(255,255,255,0.03);
      border:1px solid var(--glass-border-dim);
      border-radius:10px;
    }
    .pd-actions{ display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:6px; }

    /* ── Activity screen ─────────────────────────────────────────────────────────────── */
    .act-layout{ display:grid; grid-template-columns: 220px 1fr; gap:14px; }
    .act-side-panel{ padding:8px 6px; align-self:start; }
    .side-filter{
      height:30px; display:flex; align-items:center; gap:9px;
      padding:0 10px; margin:0 4px;
      border-radius:8px; font-size:12px; font-weight:500;
      color:var(--text-2); cursor:default;
      transition: background 150ms ease, color 150ms ease;
    }
    .side-filter:hover{ background: var(--glass-bg-hover); color:var(--text); }
    .side-filter.active{ background: var(--glass-bg-active); color:var(--text); }
    .side-count{
      margin-left:auto; font-size:10px; color:var(--text-3);
      font-variant-numeric:tabular-nums;
    }
    .mini-dot{
      width:6px; height:6px; border-radius:50%;
      background: var(--success); flex-shrink:0;
    }
    .mini-dot.blue{ background: var(--accent-blue); }
    .mini-dot.yellow{ background: var(--warning); }
    .side-tiles{ display:flex; gap:2px; }

    .act-main{ display:flex; flex-direction:column; gap:14px; }
    .act-group-head{
      display:flex; align-items:baseline; gap:10px;
      padding:0 4px 8px;
    }
    .act-group-label{ font-size:13px; font-weight:600; color:var(--text); }
    .act-group-count{ font-size:11px; color:var(--text-3); }
    .act-side{ width:18px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }

    /* ── Library screen ──────────────────────────────────────────────────────────────── */
    .lib-pair-bar{
      display:flex; align-items:center; gap:14px;
      padding:12px 14px; margin-bottom:14px;
    }
    .lib-slot{
      flex:1; display:flex; flex-direction:column; gap:4px; min-width:0;
    }
    .lib-slot-lbl{
      font-size:10px; font-weight:600; letter-spacing:0.08em;
      text-transform:uppercase; color:var(--text-3);
    }
    .lib-slot-empty{
      height:32px; display:flex; align-items:center;
      padding:0 12px; border-radius:10px;
      background: rgba(255,255,255,0.03);
      border:1px dashed var(--glass-border);
      font-size:13px; color:var(--text-3);
    }
    .lib-slot-val{
      height:32px; display:flex; align-items:center; gap:8px;
      padding:0 6px 0 8px; border-radius:10px;
      background: var(--glass-bg-active);
      border:1px solid var(--glass-border);
      font-size:13px; color:var(--text);
    }
    .lib-slot-val > span:first-of-type{
      flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .lib-slot-x{
      width:20px; height:20px; border-radius:6px;
      display:flex; align-items:center; justify-content:center;
      color: var(--text-3); cursor:default;
    }
    .lib-slot-x:hover{ background: rgba(255,255,255,0.06); color:var(--text); }
    .lib-link{ display:flex; align-items:flex-end; height:48px; }
    .lib-cta.disabled{ opacity:.45; pointer-events:none; }

    .lib-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .lib-col{ display:flex; flex-direction:column; gap:10px; }
    .lib-col-head{
      display:flex; align-items:center; gap:8px; padding: 0 4px;
    }
    .lib-col-title{ font-size:14px; font-weight:600; color:var(--text); letter-spacing:-0.01em; }
    .lib-col-head .count{
      font-size: 11px; font-weight: 500; color: var(--text-3);
      padding: 2px 7px; border-radius: 999px;
      border: 1px solid var(--glass-border-dim);
    }
    .lib-account{
      display:inline-flex; align-items:center; gap:6px;
      font-size:11px; color:var(--text-3);
      padding:3px 8px; border-radius:999px;
      background: rgba(255,255,255,0.03); border:1px solid var(--glass-border-dim);
    }
    .lib-list{ padding:6px 0; max-height:none; }
    .lib-item{
      display:flex; align-items:center; gap:11px;
      padding:9px 14px; cursor:default;
      transition: background 150ms ease;
      border-bottom:1px solid var(--glass-border-dim);
    }
    .lib-item:last-child{ border-bottom:0; }
    .lib-item:hover{ background: rgba(255,255,255,0.04); }
    .lib-item.picked{ background: var(--glass-bg-active); }
    .lib-item-text{ flex:1; min-width:0; }
    .lib-item-name{
      font-size:13px; font-weight:500; color:var(--text);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .lib-item-sub{
      font-size:11px; color:var(--text-3);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .lib-item-meta{
      display:flex; flex-direction:column; align-items:flex-end; gap:3px;
      flex-shrink:0;
    }
    .lib-item-size{ font-size:11px; color:var(--text-3); }
    .lib-paired{
      display:inline-flex; align-items:center; gap:4px;
      font-size:10px; color:#7CFF5E;
      padding:1px 7px; border-radius:999px;
      background: rgba(57,255,20,0.08); border:1px solid rgba(57,255,20,0.18);
    }
    .lib-unpaired{
      font-size:10px; color:var(--text-3);
      padding:1px 7px; border-radius:999px;
      border:1px solid var(--glass-border-dim);
    }

    /* ── Settings screen ──────────────────────────────────────────────────── */
    .set-layout{ display:grid; grid-template-columns: 200px 1fr; gap:14px; align-items:start; }
    .set-side{ padding:8px 6px; align-self:start; }
    .set-side-item{
      height:32px; display:flex; align-items:center; gap:10px;
      padding:0 10px; margin:0 4px;
      border-radius:8px; font-size:13px; font-weight:500;
      color:var(--text-2); cursor:default;
      transition: background 150ms ease, color 150ms ease;
    }
    .set-side-item .ic{ width:14px; height:14px; }
    .set-side-item:hover{ background: var(--glass-bg-hover); color:var(--text); }
    .set-side-item.active{ background: var(--glass-bg-active); color:var(--text); }

    .set-main{ display:flex; flex-direction:column; gap:14px; }
    .set-card{ padding:18px 20px; }
    .set-card-h{
      display:flex; align-items:flex-start; gap:14px;
      padding-bottom:14px; border-bottom:1px solid var(--glass-border-dim);
      margin-bottom:6px;
    }
    .set-card-title{ font-size:14px; font-weight:600; color:var(--text); letter-spacing:-0.01em; }
    .set-card-sub{ margin-top:3px; font-size:12px; color:var(--text-3); }
    .set-card-h .btn{ margin-left:auto; }

    .set-acct{ display:flex; align-items:center; gap:14px; padding:10px 0; }
    .set-acct-avatar{
      width:42px; height:42px; border-radius:50%;
      background:linear-gradient(135deg,#4B8EFF,#9D4BFF);
      display:flex; align-items:center; justify-content:center;
      font-size:14px; font-weight:600; color:#fff;
      border:1px solid rgba(255,255,255,0.15); flex-shrink:0;
    }
    .set-acct-text{ flex:1; min-width:0; }
    .set-acct-name{ font-size:14px; font-weight:600; color:var(--text); }
    .set-acct-mail{ font-size:12px; color:var(--text-2); margin-top:2px; }
    .set-acct-meta{ font-size:11px; color:var(--text-3); margin-top:3px; }

    .set-perms{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .set-perm{
      display:inline-flex; align-items:center; gap:6px;
      font-size:11px; color:var(--text-2);
      padding:4px 9px; border-radius:999px;
      background: rgba(57,255,20,0.06);
      border:1px solid rgba(57,255,20,0.18);
    }
    .set-perm.muted{
      color:var(--text-3); background: rgba(255,255,255,0.03);
      border-color: var(--glass-border-dim);
    }
    .set-folders{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
    .set-folder{
      display:flex; align-items:center; gap:10px;
      padding:8px 12px; border-radius:8px;
      background: rgba(255,255,255,0.03);
      border:1px solid var(--glass-border-dim);
      font-size:12px; color:var(--text-2);
    }
    .set-folder .mono{ flex:1; color:var(--text); }
    .set-folder .muted{ font-size:11px; color:var(--text-3); }

    .set-field-row{
      display:flex; align-items:center; gap:14px;
      padding:14px 0; border-top:1px solid var(--glass-border-dim);
    }
    .set-field-row:first-child{ border-top:0; padding-top:8px; }
    .set-field{ flex:1; min-width:0; }
    .set-field-lbl{ font-size:13px; font-weight:500; color:var(--text); }
    .set-field-help{ font-size:12px; color:var(--text-3); margin-top:3px; line-height:1.5; }
    .set-field-help .kbd{
      font-family: var(--mono); font-size:10px; color:var(--text-2);
      padding:1px 5px; border-radius:4px;
      border:1px solid var(--glass-border); background: rgba(255,255,255,0.03);
    }

    .twk-toggle{
      width:32px; height:18px; border-radius:999px;
      background: rgba(255,255,255,0.08);
      border:1px solid var(--glass-border);
      position:relative; cursor:default; flex-shrink:0;
      transition: background 150ms ease;
      padding:0;
    }
    .twk-toggle[data-on="1"]{ background: rgba(57,255,20,0.30); border-color: rgba(57,255,20,0.5); }

    .seg-control{
      display:inline-flex; gap:2px; padding:2px;
      background: rgba(255,255,255,0.04);
      border:1px solid var(--glass-border);
      border-radius: 9px;
    }
    .seg-control button{
      height:24px; padding:0 11px;
      background:transparent; border:0; border-radius:7px;
      color:var(--text-2); font:inherit; font-size:12px; font-weight:500;
      cursor:default; transition: background 150ms ease, color 150ms ease;
    }
    .seg-control button:hover{ color:var(--text); }
    .seg-control button.on{
      background: var(--glass-bg-active); color: var(--text);
    }

    .set-throttle{ display:inline-flex; align-items:center; gap:12px; }
    .set-throttle input{ width:140px; accent-color: var(--accent-green); }
    .set-throttle .mono{ font-size:12px; color:var(--text-2); min-width:38px; text-align:right; }

    .set-input{
      height:30px; padding:0 10px; min-width:220px;
      background: rgba(255,255,255,0.04);
      border:1px solid var(--glass-border);
      border-radius:8px;
      color:var(--text); font:inherit; font-size:12px;
      outline:none;
    }
    .set-input:focus{ border-color: rgba(75,142,255,0.5); }

    .set-opt{
      display:flex; gap:11px;
      padding:11px 12px; margin-top:6px;
      border:1px solid var(--glass-border-dim);
      border-radius:10px; cursor:default;
      transition: background 150ms ease, border-color 150ms ease;
    }
    .set-opt:hover{ background: rgba(255,255,255,0.03); }
    .set-opt.selected{
      background: rgba(57,255,20,0.06);
      border-color: rgba(57,255,20,0.25);
    }
    .set-opt-radio{
      width:14px; height:14px; border-radius:50%;
      border:1.4px solid var(--text-3);
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0; margin-top:1px;
      transition: border-color 150ms ease;
    }
    .set-opt-radio.on{ border-color: var(--accent-green); }
    .set-opt-radio.on > span{
      width:6px; height:6px; border-radius:50%; background: var(--accent-green);
    }
    .set-opt-title{ font-size:13px; font-weight:500; color:var(--text); }
    .set-opt-help{ font-size:12px; color:var(--text-3); margin-top:2px; line-height:1.5; }

    .set-quota{ display:inline-flex; align-items:center; gap:10px; }
    .set-quota-bar{
      width:160px; height:5px; border-radius:999px;
      background: rgba(255,255,255,0.06);
      overflow:hidden;
    }
    .set-quota-bar > i{
      display:block; height:100%;
      background: linear-gradient(90deg, var(--accent-green), #6FFF52);
    }
    .set-quota .mono{ font-size:12px; color:var(--text-2); }
    .set-net-status .status-badge{ background: var(--glass-bg); }

    /* ── Onboarding (3-step) ──────────────────────────────────────────────────────── */
    .onb-back{
      position:fixed; inset:0; z-index:120;
      display:flex; align-items:center; justify-content:center;
      background: rgba(0,0,0,0.40);
      backdrop-filter: blur(8px); padding: 20px;
    }
    .onb{
      width: 460px; max-width:100%;
      padding: 30px 32px 22px;
      backdrop-filter: blur(30px) saturate(150%);
      -webkit-backdrop-filter: blur(30px) saturate(150%);
      border-radius: 20px;
      position:relative;
      animation: onb-in 240ms ease-out;
    }
    @keyframes onb-in{
      from{ opacity:0; transform: translateY(8px) scale(0.98); }
      to{ opacity:1; transform: translateY(0) scale(1); }
    }
    .onb-close{
      position:absolute; top:14px; right:14px;
      width:26px; height:26px; border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      color:var(--text-3); cursor:default;
    }
    .onb-close:hover{ background: rgba(255,255,255,0.06); color: var(--text); }

    .onb-steps{
      display:flex; align-items:center; justify-content:center; gap:12px;
      margin-bottom: 20px;
    }
    .onb-step{ display:flex; align-items:center; gap:12px; }
    .onb-step + .onb-step::before{
      content:""; width:32px; height:1px; background: var(--glass-border);
    }
    .onb-step-dot{
      display:flex; align-items:center; justify-content:center;
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border-dim);
      font-size: 11px; font-weight: 600; color: var(--text-3);
      transition: all 200ms ease;
    }
    .onb-step-dot.active{
      background: var(--glass-bg-active);
      border-color: rgba(57,255,20,0.6);
      color: var(--accent-green);
    }
    .onb-step-dot.done{
      background: rgba(57,255,20,0.18);
      border-color: rgba(57,255,20,0.5);
      color: var(--accent-green);
    }

    .onb-pair{
      display:flex; align-items:center; justify-content:center;
      gap:14px; margin: 4px 0 22px;
    }
    .onb-h{
      margin:0 0 8px; font-size:22px; font-weight:700;
      letter-spacing:-0.025em; color:var(--text); text-align:center;
    }
    .onb-p{
      margin:0 auto 20px; font-size:13px; color:var(--text-2);
      line-height:1.55; text-align:center; max-width:380px;
    }

    .btn-google{
      display:flex; align-items:center; justify-content:center; gap:10px;
      width:100%; height:40px; border-radius:12px;
      background:#fff; color:#1f1f1f;
      font:inherit; font-size:13px; font-weight:500;
      border:1px solid rgba(0,0,0,0.06);
      cursor:default;
      transition: background 150ms ease;
    }
    .btn-google:hover{ background:#f4f4f4; }
    .btn-google.disabled{ opacity:.55; pointer-events:none; }

    .onb-acct{
      display:flex; align-items:center; gap:12px;
      padding:12px 14px; border-radius:12px;
      background: rgba(57,255,20,0.06);
      border:1px solid rgba(57,255,20,0.28);
    }
    .onb-acct-avatar{
      width:34px; height:34px; border-radius:50%;
      background:linear-gradient(135deg,#4B8EFF,#9D4BFF);
      display:flex; align-items:center; justify-content:center;
      font-size:12px; font-weight:600; color:#fff;
    }
    .onb-acct-text{ flex:1; min-width:0; }
    .onb-acct-name{ font-size:13px; font-weight:600; color:var(--text); }
    .onb-acct-mail{ font-size:11px; color:var(--text-2); }
    .onb-acct-check{
      width:22px; height:22px; border-radius:50%;
      background: var(--accent-green); color:#0a1f04;
      display:flex; align-items:center; justify-content:center;
    }

    .onb-perms{
      display:flex; flex-direction:column; gap:6px;
      margin-top:14px; padding:12px 14px;
      background: rgba(255,255,255,0.03);
      border:1px solid var(--glass-border-dim);
      border-radius:10px;
    }
    .onb-perms-h{
      font-size:10px; font-weight:600; letter-spacing:0.08em;
      text-transform:uppercase; color:var(--text-3); margin-bottom:4px;
    }
    .onb-perm{
      display:flex; align-items:center; gap:8px;
      font-size:12px; color:var(--text-2);
    }
    .onb-perm .ic{ color: var(--accent-green); flex-shrink:0; }

    .onb-field{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
    .onb-field-lbl{
      font-size:11px; font-weight:600; letter-spacing:0.04em;
      text-transform:uppercase; color:var(--text-3);
    }
    .onb-file-input{
      display:flex; align-items:center; gap:10px;
      padding:9px 12px; border-radius:10px;
      background: rgba(255,255,255,0.04);
      border:1px solid var(--glass-border);
      cursor:default;
      transition: background 150ms ease, border-color 150ms ease;
    }
    .onb-file-input:hover{ background: var(--glass-bg-hover); }
    .onb-file-input.filled{
      background: rgba(57,255,20,0.05);
      border-color: rgba(57,255,20,0.28);
    }
    .onb-file-text{ flex:1; min-width:0; }
    .onb-file-name{
      font-size:13px; color:var(--text);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .onb-file-sub{
      font-family: var(--mono); font-size:11px; color:var(--text-3);
      margin-top:1px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
