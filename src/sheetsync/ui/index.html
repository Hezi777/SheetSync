<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SheetSync Mockup</title>
  <style>
    @font-face {
      font-family: 'Satoshi';
      src: url('fonts/satoshi-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Satoshi';
      src: url('fonts/satoshi-500.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Satoshi';
      src: url('fonts/satoshi-700.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Satoshi';
      src: url('fonts/satoshi-900.woff2') format('woff2');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }
  </style>
  <style>
    :root {
      --primary: #5645d4;
      --primary-pressed: #4534b3;
      --green: #168451;
      --green-deep: #0f5f3a;
      --green-soft: #d9f3e1;
      --navy: #0a1530;
      --orange: #dd5b00;
      --pink: #ff64c8;
      --teal: #2a9d99;
      --yellow: #f5d75e;
      --peach: #ffe8d4;
      --rose: #fde0ec;
      --mint: #d9f3e1;
      --lavender: #e6e0f5;
      --sky: #dcecfa;
      --cream: #f8f5e8;
      --canvas: #ffffff;
      --surface: #f6f5f4;
      --surface-soft: #fafaf9;
      --control: #ffffff;
      --hairline: #e5e3df;
      --hairline-soft: #ede9e4;
      --hairline-strong: #c8c4be;
      --ink: #1a1a1a;
      --charcoal: #37352f;
      --slate: #5d5b54;
      --steel: #787671;
      --stone: #a4a097;
      --error: #e03131;
      --font: "Satoshi", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
      --mono: "SFMono-Regular", "Cascadia Mono", Consolas, ui-monospace, monospace;
      --shadow: rgba(15, 15, 15, 0.08) 0 4px 12px;
      --shadow-large: rgba(15, 15, 15, 0.16) 0 16px 48px -8px;
      --shell: #f6f5f4;
    }

    body[data-theme="dark"] {
      --canvas: #111210;
      --surface: #0b0c0b;
      --surface-soft: #10110f;
      --control: #171816;
      --hairline: rgba(255,255,255,.095);
      --hairline-soft: rgba(255,255,255,.055);
      --hairline-strong: rgba(255,255,255,.16);
      --ink: rgba(255,255,255,.94);
      --charcoal: rgba(255,255,255,.84);
      --slate: rgba(255,255,255,.62);
      --steel: rgba(255,255,255,.48);
      --stone: rgba(255,255,255,.34);
      --mint: rgba(22,132,81,.24);
      --peach: rgba(221,91,0,.24);
      --shadow: rgba(0,0,0,.24) 0 4px 12px;
      --shadow-large: rgba(0,0,0,.46) 0 18px 54px -10px;
      --shell: #080908;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--shell);
      color: var(--ink);
      font-family: var(--font);
      overflow: hidden;
    }
    body[data-theme="dark"] { background: var(--shell); }
    button, input, textarea, select { font: inherit; }
    button { cursor: default; }
    a { color: #0075de; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .lucide { width: 16px; height: 16px; stroke-width: 1.8; }

    .frame {
      height: 100vh;
      margin: 0;
      border-radius: 0;
      background: var(--shell);
      box-shadow: none;
      padding: 0;
      display: grid;
      grid-template-columns: 198px minmax(0, 1fr);
      gap: 0;
      overflow: hidden;
    }
    .sidebar {
      background: var(--surface);
      border: 0;
      border-right: 1px solid var(--hairline-soft);
      border-radius: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }
    .vertical-nav {
      height: 100%;
      padding: 14px 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .brand-block {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px 22px;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--green), var(--teal));
      box-shadow: 0 8px 22px rgba(22,132,81,.20);
    }
    .brand-block h2 { margin: 0 0 2px; font-size: 15px; font-weight: 700; }
    .brand-block p { display: none; }
    .nav-label {
      color: var(--stone);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 8px 8px 7px;
    }
    .pinned-label { margin-top: 18px; }
    .nav-list { display: flex; flex-direction: column; gap: 4px; }
    .nav-btn {
      width: 100%;
      height: 28px;
      border: 0;
      background: transparent;
      border-radius: 6px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      color: var(--charcoal);
      font-size: 12px;
      font-weight: 650;
      text-align: left;
      transform: translateX(0);
      transition: background 150ms ease, color 150ms ease, transform 150ms ease;
    }
    .nav-btn:hover {
      background: color-mix(in srgb, var(--control) 62%, transparent);
      color: var(--ink);
      transform: translateX(2px);
    }
    .nav-btn span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-btn.active {
      color: var(--ink);
      background: var(--surface);
    }
    body[data-theme="dark"] .nav-btn.active {
      background: rgba(255,255,255,.12);
    }
    .nav-btn .lucide { margin-right: 2px; }
    .nav-dot {
      margin-left: auto;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 8px rgba(22,132,81,.55);
    }
    .pair-link {
      height: 28px;
      font-size: 12px;
      color: var(--steel);
    }
    .workspace {
      min-width: 0;
      display: grid;
      grid-template-rows: 42px minmax(0, 1fr);
      gap: 0;
      overflow: hidden;
    }
    .topbar {
      background: var(--shell);
      border: 0;
      border-bottom: 1px solid var(--hairline-soft);
      border-radius: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px 0 18px;
    }
    .crumbs {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--steel);
      font-size: 12px;
      font-weight: 650;
    }
    .crumbs strong { color: var(--ink); }
    .toolbar-spacer { flex: 1; }
    .toolbar-search {
      width: min(220px, 28vw);
      height: 26px;
      border: 1px solid var(--hairline-strong);
      border-radius: 6px;
      background: var(--control);
      color: var(--stone);
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 8px;
      min-width: 0;
    }
    .toolbar-search input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 11px;
    }
    .mobile-nav-trigger {
      display: none;
      position: fixed;
      left: 22px;
      top: 22px;
      z-index: 40;
      width: 42px;
      height: 42px;
      border: 1px solid var(--hairline);
      background: var(--control);
      color: var(--ink);
      border-radius: 12px;
      place-items: center;
      box-shadow: var(--shadow);
    }
    .mobile-sheet-layer {
      position: fixed;
      inset: 0;
      z-index: 70;
    }
    .mobile-sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 15, .34);
    }
    .mobile-sheet {
      position: absolute;
      inset: 0 auto 0 0;
      width: 240px;
      background: var(--canvas);
      border-right: 1px solid var(--hairline);
      box-shadow: var(--shadow-large);
    }
    .mobile-sheet-close {
      position: absolute;
      right: 10px;
      top: 10px;
      z-index: 1;
      width: 32px;
      height: 32px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--control);
      color: var(--ink);
      display: grid;
      place-items: center;
    }
    .search {
      flex: 1;
      height: 44px;
      border-radius: 12px;
      background: var(--surface-soft);
      border: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      color: var(--stone);
      min-width: 180px;
    }
    .search input {
      border: 0;
      outline: 0;
      background: transparent;
      flex: 1;
      min-width: 0;
      color: var(--ink);
      font-size: 14px;
    }
    .kbd {
      border: 1px solid var(--hairline);
      border-radius: 4px;
      padding: 1px 4px;
      color: var(--steel);
      background: var(--control);
      font-family: var(--mono);
      font-size: 10px;
    }
    .top-icon {
      width: 42px;
      height: 42px;
      border: 1px solid var(--hairline);
      background: var(--control);
      border-radius: 14px;
      display: grid;
      place-items: center;
    }
    .icon-toggle {
      width: 32px;
      height: 32px;
      border: 1px solid var(--hairline);
      background: var(--control);
      color: var(--charcoal);
      border-radius: 10px;
      display: grid;
      place-items: center;
    }
    .sidebar-foot {
      margin-top: auto;
      padding: 10px 8px 0;
      border-top: 1px solid var(--hairline-soft);
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) 32px;
      gap: 10px;
      align-items: center;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--peach);
      font-weight: 700;
      color: #793400;
    }
    .avatar-meta { min-width: 0; }
    .avatar-meta strong { display: block; font-size: 12px; color: var(--ink); }
    .avatar-meta span {
      display: block;
      color: var(--steel);
      font-size: 11px;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sidebar-theme { justify-self: end; }

    .content {
      min-height: 0;
      overflow: auto;
      padding: 18px 22px 26px;
      background: var(--shell);
      border-radius: 0;
      border: 0;
    }
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin: 0 0 18px;
    }
    .page-title { margin: 0; font-size: 28px; line-height: 1.1; letter-spacing: 0; }
    .page-sub { color: var(--steel); margin-top: 6px; font-size: 13px; }
    .head-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--hairline-strong);
      background: var(--control);
      color: var(--ink);
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 550;
    }
    .btn.compact { height: 28px; padding: 0 11px; border-radius: 7px; }
    .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
    .btn.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
    .btn.google { background: var(--control); border-color: var(--hairline-strong); }
    .btn.danger { color: var(--error); }
    .btn:disabled { opacity: .45; }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.1fr 1.1fr 1.1fr .95fr;
      gap: 10px;
    }
    .dashboard-grid.essentials-grid { grid-template-columns: 1.2fr 1fr 1fr; }
    .card {
      background: var(--canvas);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      padding: 16px;
      box-shadow: rgba(15, 15, 15, .03) 0 1px 2px;
      min-width: 0;
    }
    .stat-card {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .stat-card.primary {
      background: linear-gradient(145deg, #06351f, #168451);
      color: #fff;
      border-color: transparent;
    }
    .stat-card.primary .tiny-badge {
      background: rgba(255,255,255,.16);
      color: #fff;
      border: 1px solid rgba(255,255,255,.18);
    }
    .card-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .card-title { font-size: 15px; font-weight: 650; margin: 0; }
    .card-sub { color: var(--steel); font-size: 13px; margin: 4px 0 0; line-height: 1.4; }
    .primary .card-sub { color: rgba(255,255,255,.72); }
    .jump {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid currentColor;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .stat-value { font-size: 38px; line-height: .95; font-weight: 650; letter-spacing: 0; }
    .stat-foot { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--green-deep); }
    .primary .stat-foot { color: rgba(255,255,255,.82); }
    .tiny-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 12px;
      font-weight: 650;
      background: var(--mint);
      color: var(--green-deep);
    }

    .lower-grid {
      display: grid;
      grid-template-columns: 1.35fr .68fr .68fr;
      gap: 10px;
      margin-top: 10px;
      align-items: stretch;
    }
    .lower-grid.essentials-lower { grid-template-columns: 1.4fr .8fr; }
    .essentials-lower .wide { grid-column: auto; }
    .single-row { grid-template-columns: 1fr; }
    .wide { grid-column: span 2; }
    .activity-card { grid-column: span 2; }
    .single-row .activity-card { grid-column: auto; }
    .sync-card { min-height: 260px; }
    .sync-paths {
      display: grid;
      grid-template-columns: 1fr 42px 1fr;
      gap: 10px;
      align-items: center;
      margin-top: 18px;
    }
    .path-box {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: center;
      min-width: 0;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      padding: 12px;
      background: var(--surface-soft);
    }
    .path-box strong { display: block; font-size: 14px; }
    .path-box span { display: block; color: var(--steel); font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .path-arrow {
      width: 42px;
      height: 42px;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: var(--steel);
      background: var(--control);
    }
    .control-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .project-list { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
    .project-row { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; }
    .project-logo {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: #fff;
    }
    .project-row strong { display: block; font-size: 13px; }
    .project-row span { display: block; color: var(--stone); font-size: 11px; margin-top: 2px; }
    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .section-head p {
      margin: 4px 0 0;
      color: var(--steel);
      font-size: 12px;
      line-height: 1.4;
    }
    .section-head h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }
    .count-pill {
      min-width: 20px;
      height: 20px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      color: var(--stone);
      font-size: 11px;
    }
    .pairs-stack {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sync-hub {
      margin-top: 10px;
      padding: 16px;
    }
    .sync-hub-head {
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .sync-pair-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .sync-detail-panel {
      border: 1px solid var(--hairline);
      border-radius: 10px;
      background: var(--surface-soft);
      padding: 14px;
    }
    .pair-row-card {
      width: 100%;
      border: 1px solid var(--hairline);
      border-radius: 10px;
      background: var(--canvas);
      color: var(--charcoal);
      padding: 12px;
      text-align: left;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }
    .pair-row-card:hover {
      border-color: var(--hairline-strong);
      transform: translateY(-1px);
    }
    .pair-row-card.active {
      border-color: rgba(22,132,81,.42);
      background: color-mix(in srgb, var(--green) 10%, var(--canvas));
    }
    .pair-row-main {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }
    .pair-row-main .state-pill {
      grid-column: 1 / -1;
      justify-self: start;
      margin-top: 4px;
    }
    .pair-source-icons {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--stone);
    }
    .pair-source {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--green);
    }
    .pair-source.sheet { background: var(--teal); }
    .pair-row-title {
      min-width: 0;
    }
    .pair-row-title strong {
      display: block;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.2;
    }
    .pair-row-title span {
      display: block;
      margin-top: 3px;
      color: var(--stone);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .state-pill {
      height: 22px;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--steel);
      font-size: 11px;
    }
    .state-pill span {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 8px rgba(22,132,81,.55);
    }
    .state-pill.idle span {
      background: var(--stone);
      box-shadow: none;
    }
    .state-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--stone);
      flex-shrink: 0;
    }
    .state-dot.live { background: var(--green); box-shadow: 0 0 8px rgba(22,132,81,.55); }
    .state-dot.idle { background: var(--yellow); }
    .pair-row-stats {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .pair-row-stats strong {
      display: block;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.1;
    }
    .pair-row-stats span {
      display: block;
      margin-top: 3px;
      color: var(--stone);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .pill {
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      background: var(--control);
      color: var(--steel);
      white-space: nowrap;
    }
    .readiness-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; color: var(--charcoal); font-size: 13px; }
    .readiness-list div { display: flex; gap: 8px; align-items: center; }
    .readiness-list .lucide { color: var(--green); }

    .settings-layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }
    .settings-pairs {
      position: sticky;
      top: 0;
    }
    .settings-pair-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .settings-pair {
      width: 100%;
      min-height: 48px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--charcoal);
      padding: 9px 10px;
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr) 16px;
      align-items: center;
      gap: 10px;
      text-align: left;
      transition: background 150ms ease, border-color 150ms ease, transform 150ms ease;
    }
    .settings-pair:hover {
      background: color-mix(in srgb, var(--control) 62%, transparent);
      transform: translateX(2px);
    }
    .settings-pair.active {
      background: var(--surface-soft);
      border-color: var(--hairline);
    }
    .settings-pair strong {
      display: block;
      color: var(--ink);
      font-size: 12px;
      line-height: 1.2;
    }
    .settings-pair span:not(.state-dot) {

    .settings-main {

    .settings-form-grid {

      grid-template-columns: 1fr 1fr;
      gap: 0 12px;
      margin-top: 6px;

    .wide-field { grid-column: 1 / -1; }
    .settings-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;

    .settings-toggle-row {

      display: block;
      color: var(--ink);
      font-size: 13px;

    .switch {
      width: 34px;
      height: 20px;
      border-radius: 999px;
      background: var(--hairline-strong);
      position: relative;
      display: block;

      grid-template-columns: repeat(4, 1fr);
      gap: 8px;

      background: rgba(255,255,255,.04);
    }
    body[data-theme="dark"] .overlay-step.active {
      background: rgba(255,255,255,.12);
      color: var(--ink);
      border-color: var(--hairline-strong);
    }
    .overlay-body {
      min-height: 300px;
      border: 1px solid var(--hairline);
      border-radius: 16px;
      background: rgba(255,255,255,.68);
      padding: 22px;
    }
    body[data-theme="dark"] .overlay-body {
      background: rgba(255,255,255,.04);
    }
    .overlay-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
    }
    .simple-step > .lucide, .simple-step > .google-g {
      width: 34px;
      height: 34px;
      color: var(--green);

    .compact-links { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }

      height: 30px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--control);
      padding: 0 9px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .file-drop {
      min-height: 46px;
      border: 1px dashed var(--hairline-strong);
      border-radius: 10px;
      background: var(--surface-soft);
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 12px;
      color: var(--slate);
      font-size: 14px;

    .callout {
      border-radius: 14px;
      padding: 14px;
      background: var(--cream);
      border: 1px solid var(--hairline);
      margin-top: 14px;
    }
    .callout strong { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .field { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }

    .input, .textarea, .select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--hairline-strong);
      border-radius: 8px;
      background: var(--control);
      color: var(--ink);
      padding: 10px 12px;
      outline: none;

    .textarea { min-height: 128px; font-family: var(--mono); font-size: 12px; resize: vertical; }

    .link-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .link-card {
      border: 1px solid var(--hairline);
      border-radius: 12px;
      padding: 12px;
      background: var(--surface-soft);
    }
    .link-card strong { display: flex; align-items: center; gap: 8px; font-size: 13px; }

    .side-panel {
      background: var(--navy);
      color: #fff;
      border-radius: 14px;
      padding: 16px;
      align-self: stretch;
    }
    .side-panel p { color: rgba(255,255,255,.68); font-size: 13px; }
    .check-list { display: flex; flex-direction: column; gap: 11px; margin-top: 16px; }
    .check-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,.84); }
    .google-g { width: 18px; height: 18px; flex-shrink: 0; }

    @media (max-width: 1120px) {
      body { overflow: auto; }
      .frame { height: auto; min-height: 100vh; grid-template-columns: 1fr; }
