<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SheetSync Mockup</title>
  <style>
    @font-face {
      font-family: 'Satoshi';
      src: url('./assets/satoshi-400-CPM9dct4.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Satoshi';
      src: url('./assets/satoshi-500-ByP-Zb-9.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Satoshi';
      src: url('./assets/satoshi-700-Bd5kKQ_U.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Satoshi';
      src: url('./assets/satoshi-900-DjnQuuRz.woff2') format('woff2');
      font-weight: 900;
      font-style: normal;
      font-display: swap;
    }
  </style>
  <style>
    :root {
      /* SheetSync brand */
      --green: #16a34a;
      --green-deep: #15803d;
      --green-soft: rgba(22,163,74,.14);
      /* Raycast primary CTA — white pill */
      --primary: #ffffff;
      --primary-pressed: #e8e8e8;
      --on-primary: #000000;
      /* Surfaces — 4-step dark ladder */
      --canvas: #07080a;
      --surface: #0d0d0d;
      --surface-soft: #101111;
      --control: #121212;
      --shell: #07080a;
      /* Borders */
      --hairline: #242728;
      --hairline-soft: rgba(255,255,255,.08);
      --hairline-strong: rgba(255,255,255,.16);
      /* Text */
      --ink: #f4f4f6;
      --charcoal: #d3d3d4;
      --slate: rgba(255,255,255,.72);
      --steel: #9c9c9d;
      --stone: #6a6b6c;
      /* Semantic */
      --error: #ff6161;
      --teal: #59d499;
      --yellow: #ffc533;
      --peach: rgba(255,197,51,.16);
      --mint: rgba(22,163,74,.15);
      --cream: #0d0d0d;
      --navy: #0a1530;
      /* Shadows — none in Raycast system */
      --shadow: none;
      --shadow-large: none;
      /* Typography */
      --font: "Satoshi", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
      --mono: "SFMono-Regular", "Cascadia Mono", Consolas, ui-monospace, monospace;
    }

    body[data-theme="light"] {
      color-scheme: light;
      --green: #168451;
      --green-deep: #0f6b3e;
      --green-soft: rgba(22,132,81,.13);
      --primary: #0c1110;
      --primary-pressed: #2c3430;
      --on-primary: #ffffff;
      --canvas: #f5f7f6;
      --surface: #ffffff;
      --surface-soft: #eef3f0;
      --control: #e7eee9;
      --shell: #f5f7f6;
      --hairline: #d9e0dc;
      --hairline-soft: rgba(12,17,16,.08);
      --hairline-strong: rgba(12,17,16,.16);
      --ink: #101413;
      --charcoal: #2f3834;
      --slate: rgba(16,20,19,.72);
      --steel: #65716b;
      --stone: #8a948e;
      --error: #c93434;
      --teal: #168451;
      --yellow: #a66b00;
      --peach: rgba(166,107,0,.13);
      --mint: rgba(22,132,81,.12);
      --cream: #ffffff;
      --navy: #dce8f6;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--shell);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: #57c1ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .lucide { width: 16px; height: 16px; stroke-width: 1.8; }

    .frame {
      height: 100vh;
      margin: 0;
      border-radius: 0;
      background:
        radial-gradient(circle at 14% 10%, rgba(89,212,153,.075), transparent 30%),
        radial-gradient(circle at 92% 90%, rgba(87,193,255,.055), transparent 34%),
        var(--shell);
      box-shadow: none;
      padding: 0;
      display: grid;
      grid-template-columns: 198px minmax(0, 1fr);
      gap: 0;
      overflow: hidden;
    }
    .sidebar {
      background: var(--surface);
      border: 0;
      border-right: 1px solid var(--hairline);
      border-radius: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }
    .vertical-nav {
      height: 100%;
      padding: 14px 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .brand-block {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px 22px;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .brand-block h2 { margin: 0 0 2px; font-size: 15px; font-weight: 700; }
    .brand-block p { display: none; }
    .nav-label {
      color: var(--stone);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 8px 8px 7px;
    }
    .pinned-label { margin-top: 18px; }
    .nav-list { display: flex; flex-direction: column; gap: 4px; }
    .nav-btn {
      width: 100%;
      height: 28px;
      border: 0;
      background: transparent;
      border-radius: 6px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      color: var(--charcoal);
      font-size: 12px;
      font-weight: 650;
      text-align: left;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      transform: translateX(0);
      transition: background 150ms ease, color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    }
    .nav-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0;
      background:
        radial-gradient(circle at 18px 50%, rgba(22,163,74,.42), transparent 32px),
        linear-gradient(90deg, rgba(22,163,74,.26), rgba(22,163,74,.08) 58%, transparent);
      transition: opacity 150ms ease;
      z-index: -1;
    }
    .nav-btn:hover {
      background: color-mix(in srgb, var(--control) 62%, transparent);
      color: var(--ink);
      transform: translateX(2px);
    }
    .nav-btn span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-btn.active {
      color: var(--ink);
      background: color-mix(in srgb, var(--green) 12%, var(--control));
      box-shadow:
        inset 0 0 0 1px rgba(22,163,74,.26),
        0 0 18px rgba(22,163,74,.16);
      transform: translateX(0);
    }
    .nav-btn.active::before { opacity: 1; }
    .nav-btn.active .lucide {
      color: #5ee88d;
      filter: drop-shadow(0 0 7px rgba(22,163,74,.55));
    }
    body[data-theme="light"] .nav-btn.active {
      background: color-mix(in srgb, var(--green) 13%, var(--surface));
      box-shadow:
        inset 0 0 0 1px rgba(22,132,81,.24),
        0 8px 18px rgba(22,132,81,.12);
    }
    body[data-theme="light"] .nav-btn.active .lucide {
      color: var(--green);
      filter: none;
    }
    .nav-btn .lucide { margin-right: 2px; }
    .nav-dot {
      margin-left: auto;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 8px rgba(22,132,81,.55);
    }
    .pair-link {
      height: 28px;
      font-size: 12px;
      color: var(--steel);
    }
    .workspace {
      min-width: 0;
      display: grid;
      grid-template-rows: 42px minmax(0, 1fr);
      gap: 0;
      overflow: hidden;
    }
    .topbar {
      background: var(--shell);
      border: 0;
      border-bottom: 1px solid var(--hairline);
      border-radius: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px 0 18px;
    }
    .crumbs {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--steel);
      font-size: 12px;
      font-weight: 650;
    }
    .crumbs strong { color: var(--ink); }
    .toolbar-spacer { flex: 1; }
    .toolbar-search {
      width: min(220px, 28vw);
      height: 26px;
      border: 1px solid var(--hairline-strong);
      border-radius: 6px;
      background: var(--control);
      color: var(--stone);
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 8px;
      min-width: 0;
    }
    .toolbar-search input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 11px;
    }
    .mobile-nav-trigger {
      display: none;
      position: fixed;
      left: 22px;
      top: 22px;
      z-index: 40;
      width: 42px;
      height: 42px;
      border: 1px solid var(--hairline);
      background: var(--control);
      color: var(--ink);
      border-radius: 12px;
      place-items: center;
      box-shadow: var(--shadow);
    }
    .mobile-sheet-layer {
      position: fixed;
      inset: 0;
      z-index: 70;
    }
    .mobile-sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 15, .34);
    }
    .mobile-sheet {
      position: absolute;
      inset: 0 auto 0 0;
      width: 240px;
      background: var(--canvas);
      border-right: 1px solid var(--hairline);
      box-shadow: var(--shadow-large);
    }
    .mobile-sheet-close {
      position: absolute;
      right: 10px;
      top: 10px;
      z-index: 1;
      width: 32px;
      height: 32px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--control);
      color: var(--ink);
      display: grid;
      place-items: center;
    }
    .search {
      flex: 1;
      height: 44px;
      border-radius: 12px;
      background: var(--surface-soft);
      border: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      color: var(--stone);
      min-width: 180px;
    }
    .search input {
      border: 0;
      outline: 0;
      background: transparent;
      flex: 1;
      min-width: 0;
      color: var(--ink);
      font-size: 14px;
    }
    .kbd {
      border: 1px solid var(--hairline);
      border-radius: 4px;
      padding: 1px 4px;
      color: var(--steel);
      background: var(--control);
      font-family: var(--mono);
      font-size: 10px;
    }
    .top-icon {
      width: 42px;
      height: 42px;
      border: 1px solid var(--hairline);
      background: var(--control);
      border-radius: 14px;
      display: grid;
      place-items: center;
    }
    .icon-toggle {
      width: 32px;
      height: 32px;
      border: 1px solid var(--hairline);
      background: var(--control);
      color: var(--charcoal);
      border-radius: 10px;
      display: grid;
      place-items: center;
    }
    .sidebar-foot {
      margin-top: auto;
      padding: 10px 8px 0;
      border-top: 1px solid var(--hairline);
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) 32px;
      gap: 10px;
      align-items: center;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--peach);
      font-weight: 700;
      color: #793400;
    }
    .avatar-meta { min-width: 0; }
    .avatar-meta strong { display: block; font-size: 12px; color: var(--ink); }
    .avatar-meta span {
      display: block;
      color: var(--steel);
      font-size: 11px;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sidebar-theme { justify-self: end; }

    .content {
      min-height: 0;
      overflow: auto;
      padding: 18px 22px 26px;
      background:
        radial-gradient(circle at 20% 0%, rgba(89,212,153,.06), transparent 30%),
        radial-gradient(circle at 100% 100%, rgba(87,193,255,.045), transparent 34%),
        transparent;
      border-radius: 0;
      border: 0;
    }
    .dashboard-page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    .dashboard-page > .lower-grid {
      flex: 1;
      min-height: 168px;
    }
    .dashboard-page .activity-card {
      display: flex;
      flex-direction: column;
    }
    .dashboard-page .activity-card .project-list {
      flex: 1;
      justify-content: center;
    }
    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin: 0 0 18px;
    }
    .page-title { margin: 0; font-size: 28px; line-height: 1.1; letter-spacing: 0; }
    .page-sub { color: var(--charcoal); margin-top: 6px; font-size: 13px; font-weight: 500; }
    .head-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--hairline);
      background: var(--surface-soft);
      color: var(--ink);
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
    }
    .btn.compact { height: 28px; padding: 0 11px; border-radius: 7px; }
    .btn.primary { background: var(--primary); border-color: transparent; color: var(--on-primary); }
    .btn.dark { background: var(--primary); border-color: transparent; color: var(--on-primary); }
    .btn.google { background: var(--surface-soft); border-color: var(--hairline); }
    .btn.danger { color: var(--error); }
    .btn:disabled { opacity: .45; }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.1fr 1.1fr 1.1fr .95fr;
      gap: 10px;
    }
    .dashboard-grid.essentials-grid { grid-template-columns: 1.2fr 1fr 1fr; }
    .card {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      padding: 16px;
      min-width: 0;
    }
    .stat-card {
      min-height: 128px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .stat-ghost {
      position: absolute;
      right: -22px;
      bottom: -28px;
      pointer-events: none;
      opacity: 0.16;
      line-height: 0;
      color: var(--ink);
    }
    .stat-ghost .lucide {
      width: 128px;
      height: 128px;
      stroke-width: 1.35;
    }
    .stat-card.primary .stat-ghost {
      opacity: 0.14;
      color: var(--ink);
    }
    .stat-card.primary {
      background: color-mix(in srgb, var(--green) 9%, var(--surface));
      border-color: rgba(22,163,74,.32);
    }
    .stat-card.primary .tiny-badge {
      background: rgba(22,163,74,.22);
      color: #4ade80;
    }
    .card-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .card-title { font-size: 15px; font-weight: 650; margin: 0; }
    .card-sub { color: var(--steel); font-size: 13px; margin: 4px 0 0; line-height: 1.4; }
    .primary .card-sub { color: rgba(255,255,255,.72); }
    body[data-theme="light"] .stat-ghost {
      opacity: 0.08;
    }
    .stat-value { font-size: 38px; line-height: .95; font-weight: 650; letter-spacing: 0; }
    .stat-foot { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--steel); }
    .primary .stat-foot { color: var(--steel); }
    .stat-foot .tiny-badge {
      background: transparent;
      padding: 0;
      border-radius: 0;
      color: #4ade80;
      font-weight: 500;
      gap: 4px;
    }
    .stat-foot .tiny-badge .lucide {
      width: 13px;
      height: 13px;
      stroke-width: 2;
    }
    .tiny-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 12px;
      font-weight: 650;
      background: rgba(22,163,74,.15);
      color: #4ade80;
    }

    .lower-grid {
      display: grid;
      grid-template-columns: 1.35fr .68fr .68fr;
      gap: 10px;
      margin-top: 10px;
      align-items: stretch;
    }
    .lower-grid.essentials-lower { grid-template-columns: 1.4fr .8fr; }
    .essentials-lower .wide { grid-column: auto; }
    .single-row { grid-template-columns: 1fr; }
    .wide { grid-column: span 2; }
    .activity-card { grid-column: span 2; }
    .single-row .activity-card { grid-column: auto; }
    .sync-card { min-height: 260px; }
    .sync-paths {
      display: grid;
      grid-template-columns: 1fr 42px 1fr;
      gap: 10px;
      align-items: center;
      margin-top: 18px;
    }
    .path-box {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: center;
      min-width: 0;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      padding: 12px;
      background: var(--surface-soft);
    }
    .path-box strong { display: block; font-size: 14px; }
    .path-box span { display: block; color: var(--steel); font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .path-arrow {
      width: 42px;
      height: 42px;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: var(--steel);
      background: var(--control);
    }
    .control-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .project-list { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
    .project-row { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; }
    .project-logo {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: #fff;
    }
    .project-row strong { display: block; font-size: 13px; }
    .project-row span { display: block; color: var(--stone); font-size: 11px; margin-top: 2px; }
    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .section-head p {
      margin: 4px 0 0;
      color: var(--steel);
      font-size: 12px;
      line-height: 1.4;
    }
    .section-head h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }
    .count-pill {
      min-width: 20px;
      height: 20px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      color: var(--stone);
      font-size: 11px;
    }
    .pairs-stack {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sync-hub {
      margin-top: 10px;
      padding: 16px;
    }
    .sync-hub-head {
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .sync-pair-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .sync-detail-panel {
      border: 1px solid var(--hairline);
      border-radius: 10px;
      background: var(--surface-soft);
      padding: 14px;
    }
    .pair-row-card {
      width: 100%;
      border: 1px solid var(--hairline);
      border-radius: 10px;
      background: var(--surface);
      color: var(--charcoal);
      padding: 12px;
      text-align: left;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }
    .pair-row-card:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    .pair-row-card:hover {
      border-color: var(--hairline-strong);
      transform: translateY(-1px);
    }
    .pair-row-card.active {
      border-color: rgba(22,163,74,.38);
      background: color-mix(in srgb, var(--green) 8%, var(--surface));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
    }
    .pair-row-main {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }
    .pair-row-main .state-pill {
      justify-self: end;
    }
    .pair-source-icons {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--stone);
    }
    .pair-source {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--green);
    }
    .pair-source.sheet { background: var(--teal); }
    .pair-row-title {
      min-width: 0;
    }
    .pair-row-title strong {
      display: block;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.2;
    }
    .pair-row-title span {
      display: block;
      margin-top: 3px;
      color: var(--stone);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .state-pill {
      height: 22px;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      padding: 0 8px;
      display: inline-flex;
